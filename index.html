<style>
/* Layout: one-column phone app; sticky header, hole strip, big tap targets for clubs, scorecard table with real golf marks (circle birdie, square bogey). */
:root{
  --bg:#000000; --surface:#0c0e0d; --ink:#eef3ef; --muted:#93a399; --line:#262c28;
  --wood:#2a1f13; --wood-line:#6e5030; --wood-ink:#f0d6b0;
  --iron:#0e2631; --iron-line:#36708b; --iron-ink:#cfeaf7;
  --wedge:#10203b; --wedge-line:#456ca8; --wedge-ink:#d3e3fc;
  --plain:#191c1a; --plain-line:#3a413c;
  --green:#2f8a57; --green-ink:#ffffff; --green-soft:#0e2417; --flag:#e8b923; --danger:#e0695c; --sand:#2d2a1f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
/* Fondo negro a propósito: en pantallas OLED lo negro va apagado y gasta menos batería. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font:700 26px/1 var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
body.playing .sync{font:700 18px/1 var(--display);color:var(--ink);letter-spacing:.02em}
body.playing header.top h1{font-size:17px;flex:0 1 auto;opacity:.8}
body.playing header.top{gap:8px}
.live{flex:0 0 auto;display:flex;align-items:baseline;gap:2px;border:1.5px solid #ffe08a;border-radius:9px;padding:3px 7px;color:#ffe08a;margin-right:auto}
.live b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.live small{font:700 12px/1 var(--body)}
.live.low{border-color:#e0a060;color:#e0a060}.live.low b{opacity:.8}
body.playing .sync i{font-style:normal;color:#b9a6ec;margin-right:8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:10px;font-weight:700;background:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.icon-btn{min-width:40px;min-height:40px;border-radius:10px;font-size:22px;color:var(--green);font-weight:700}
.label{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
section{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.round{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%}
.round .course{font:700 20px/1.1 var(--display);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.round .meta{color:var(--muted);font-size:14px;grid-column:1}
.round .score{grid-row:1/span 2;grid-column:2;text-align:right;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.round .score small{display:block;font:600 13px/1.2 var(--body);color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--flag);color:#2a2100}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:46px;padding:0 12px;width:100%;min-width:0}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.partners{display:flex;flex-direction:column;gap:8px}
.partner{display:flex;gap:8px}
/* play */
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:8px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:40px;height:44px;border-radius:9px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.strip button b{font:700 17px/1 var(--display)}
.strip button span{font-size:11px;color:var(--muted)}
.strip button[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.strip button.has span{color:var(--ink);font-weight:700}
.hole{background:var(--green-soft);border:1.5px solid var(--green);color:var(--ink);border-radius:14px;padding:3px 6px;display:flex;align-items:center;gap:6px;min-height:52px}
.hole .nav{font-size:28px;min-width:40px;min-height:40px;color:inherit;border-radius:10px;flex:0 0 auto}
.hole .nav:disabled{opacity:.3}
.hole .num{font:700 34px/1 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.hole .num small{font-size:18px;opacity:.75;margin-right:2px}
.hole .ecl{flex:0 0 auto;min-width:58px;height:48px;border:1.5px solid #8a6fd1;border-radius:9px;padding:2px 4px 2px 2px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2px;line-height:1}
.hole .ecl span{font:700 10px/1 var(--body);letter-spacing:.08em;color:#b9a6ec;writing-mode:vertical-rl;transform:rotate(180deg)}
.hole .ecl b{font:700 42px/1 var(--display)}
.hole .ecl.better{background:#2a1f4a}.hole .ecl.better b{color:#7fd39f}
.eclrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.eclcol{display:flex;flex-direction:column;gap:6px}
body.light{--bg:#eef0f4;--surface:#ffffff;--ink:#1d2433;--muted:#5b6475;--line:#cfd5de;--green:#1f7a4a;--green-ink:#fff;color-scheme:light}
.eclhead,.eclh{display:grid;grid-template-columns:30px 34px 1fr;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.eclhead{font:600 12px/1 var(--body);color:var(--muted);letter-spacing:.06em;text-align:center;padding:2px 0}
.eclh .n{font-weight:700;text-align:center;color:#3a4357}.eclh .p{font:700 26px/1 var(--display);color:#1f8f55;text-align:center}
.eclh input{min-height:44px;text-align:center;font:700 26px/1 var(--display);padding:0 4px;border-radius:8px;border:1.5px solid #c3c9d3;background:#fff;color:#111}
.eclh input.bir{background:#bfe7ff;border-color:#7cc4ee}
.eclh input.bog{background:#f4ee4e;border-color:#e2da2a}
.eclh input.dbl{background:#ef4a6a;border-color:#e0345a;color:#fff}
.ocrout{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.ocrout p,.ocrout ul{margin:0}.ocrout ul{padding-left:20px}
.eclh input.diff{outline:4px solid #7b5cd6;outline-offset:1px}.eclh input.unsure{outline:3px dashed #e08a00;outline-offset:1px}
.eclkey{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.eclkey i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1.5px solid #c3c9d3;background:#fff}
.eclkey i.bir{background:#bfe7ff;border-color:#7cc4ee}.eclkey i.bog{background:#f4ee4e;border-color:#e2da2a}.eclkey i.dbl{background:#ef4a6a;border-color:#e0345a}
.ecltot{display:flex;justify-content:space-between;font-weight:700;padding:6px 2px;border-top:1px solid var(--line)}
.eclsum{display:flex;justify-content:space-around;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.eclsum div{display:flex;flex-direction:column;align-items:center;gap:2px}.eclsum b{font:700 26px/1 var(--display)}
.ecldates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pars{display:flex;gap:4px;flex:1;justify-content:flex-end;min-width:0}
.pars button[aria-pressed="true"]{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2px;line-height:1;border-radius:9px;height:48px;padding:2px 4px 2px 2px;min-width:58px;max-width:none;flex:0 0 auto}
.pars button span{font:700 10px/1 var(--body);letter-spacing:.08em;writing-mode:vertical-rl;transform:rotate(180deg)}
.pars button b{font:700 42px/1 var(--display)}
.pars button{flex:1;max-width:58px;min-height:34px;border-radius:99px;border:1.5px solid currentColor;font-weight:700;font-size:13px;color:inherit;opacity:.75;white-space:nowrap;padding:0 2px}
.pars button[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#2a2100;opacity:1}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tally.live{grid-template-columns:.8fr 1.2fr 1fr}
.tally.live .big b{font-size:38px}
.tally .res b{font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.tally .res.good b{color:#7fd39f}.tally .res.bad b{color:#f0a08f}
.tally.live div{flex-direction:column;align-items:center;gap:1px;padding:2px 6px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;align-items:baseline;justify-content:center;gap:6px}
.tally b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.tally span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
section.playsec{gap:8px;padding-top:8px}
body.playing .wrap{padding-block:0 12px}
.playgrid{--key:42px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.used{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;min-width:0;max-height:calc(7 * var(--key) + 6 * 5px + 52px);overflow-y:auto}
.used li{flex:0 0 var(--key);height:var(--key);display:flex;align-items:center;gap:4px;padding:0 0 0 7px;border-radius:9px;background:var(--green-soft);border:1.5px solid var(--green);text-transform:uppercase;min-width:0}
.used li>b{color:var(--muted);font:700 13px/1 var(--display)}
.used li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;display:flex;align-items:baseline;gap:3px}
.used li span small{font:700 15px/1 var(--display)}
.used li span b{font:700 22px/1 var(--display)}
.used li{position:relative}
.used li i.sd{font:700 22px/1 var(--display);font-style:normal;color:#ffe08a;text-transform:none;flex:0 0 auto;white-space:nowrap}
.used li i.sd small{font-size:12px;margin-left:1px}
.used li i.sd.low{color:#e0a060;opacity:.8}
.used li.hasd>span small{font-size:11px}.used li.hasd>span b{font-size:15px}
.used li.hasd{gap:3px}.used li.hasd button{width:22px}
.gpsnote{font-size:12px;color:var(--muted);margin:4px 0 0}
.bagrow .gps{grid-column:1/-1;margin:-4px 0 4px 4px;font-size:13px;color:var(--muted)}
.dists{display:flex;flex-direction:column;gap:4px;font-size:14px}.dists b{font-family:var(--display);font-size:16px}
.used li button{color:var(--muted);font:600 20px/1 var(--body);width:28px;height:100%;flex:0 0 auto}
.used li.none{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted);font:600 13px/1.2 var(--body);text-transform:none;padding:0 8px}
.clubs{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.clubs button{position:relative;height:var(--key);border-radius:9px;background:var(--surface);border:1.5px solid var(--line);text-transform:uppercase;padding:2px 4px;display:flex;align-items:center;justify-content:center;min-width:0}
.lb{display:inline-flex;align-items:baseline;gap:4px}
.clubs button small{font:700 18px/1 var(--display)}
.clubs button b{font:700 26px/1 var(--display)}
.clubs .drive b{font-size:24px;letter-spacing:.02em}
.clubs button:active{background:var(--green-soft);transform:scale(.97)}
.clubs .other b{font-size:20px}
.clubs .dist{position:absolute;left:5px;top:4px;font:700 15px/1 var(--body);font-style:normal;opacity:.85;font-variant-numeric:tabular-nums}
.clubs button.hasd{padding-left:20px}
.admin{display:flex;flex-direction:column;gap:10px}
.admin .btn{min-height:54px;font-size:17px}
.bagrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center}
.bagrow input{min-height:42px}
.bagrow .m{position:relative}
.bagrow .m span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.sharebox{width:100%;min-height:160px;font:14px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px}
.clubs .putter{grid-column:span 2;height:calc(var(--key) * 1.3);background:var(--green-soft);border-color:var(--green);color:#fff;align-items:center}
.clubs .putter b{font-size:30px;letter-spacing:.06em}
.clubs .other{background:var(--plain);border-color:var(--plain-line);color:var(--ink)}
.clubs .wood,.used li.wood{background:var(--wood);border-color:var(--wood-line);color:var(--wood-ink)}
.clubs .iron,.used li.iron{background:var(--iron);border-color:var(--iron-line);color:var(--iron-ink)}
.clubs .wedge,.used li.wedge{background:var(--wedge);border-color:var(--wedge-line);color:var(--wedge-ink)}
.used li.other{background:var(--plain);border-color:var(--plain-line)}
.btn.finish{background:var(--flag);color:#2a2100;min-height:44px}
html,body,button{touch-action:manipulation}
.listtools{display:flex;gap:8px;flex-wrap:wrap}
.roundrow{display:flex;flex-direction:column;gap:6px}
.rowacts{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.rowacts .del{color:var(--danger);border-color:var(--danger)}
.confirmrow span{flex:1;font-size:14px;font-weight:600;color:var(--danger);min-width:0}
.courses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.courses button{min-height:54px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font:700 16px/1.05 var(--display);text-transform:uppercase;padding:4px;overflow-wrap:anywhere}
.courses button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.courses button.new{border-style:dashed;color:var(--green)}
.courses button.new[aria-pressed="true"]{border-style:solid;color:var(--green-ink)}
.shots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.shots li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.shots li::before{counter-increment:s;content:counter(s);font:700 18px/1 var(--display);color:var(--muted);width:20px;font-variant-numeric:tabular-nums}
.shots li span{flex:1;font-weight:600}
.shots li button{color:var(--muted);font-size:20px;min-width:36px;min-height:36px;border-radius:8px}
.hint{color:var(--muted);font-size:14px;margin:0}
.bar{display:flex;gap:10px}
.bar .btn{flex:1}
/* card */
.info{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.info b{color:var(--ink)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.h{font:700 18px/1 var(--display)}
tr.sub td{background:var(--green-soft);font-weight:700}
tr.tot td{background:var(--green);color:var(--green-ink);font-weight:700;border-bottom:0}
tr.clickable{cursor:pointer}
.mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;font:700 18px/1 var(--display)}
.mark.eagle{border:2px solid var(--green);border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--green)}
.mark.birdie{border:2px solid var(--green);border-radius:50%}
.mark.bogey{border:2px solid var(--muted)}
.mark.dbl{border:2px solid var(--muted);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px 18px;font-size:13px;color:var(--muted);align-items:center}
td.eclb{background:#e0345a;color:#fff}td.eclb .mark{border-color:#fff;box-shadow:none}
.legend .eclb{display:inline-block;width:22px;height:22px;border-radius:5px;background:#e0345a;vertical-align:middle;margin-right:6px}
.legend .mark{width:22px;height:22px;font-size:13px;margin-right:6px}
.usage{display:flex;flex-direction:column;gap:6px}
.usage div{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.usage i{display:block;height:10px;border-radius:5px;background:var(--green)}
.usage b{text-align:right;font-variant-numeric:tabular-nums}
.confirm{background:var(--surface);border:1.5px solid var(--danger);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .confirm{width:100%;max-width:380px;border-color:var(--flag);font-size:17px}
h2{font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.clubs button:active{transform:none}}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header class="top">
    <button class="icon-btn" id="back" aria-label="Volver" hidden>‹</button>
    <h1 id="title">Mis rondas</h1>
    <span class="live" id="live" hidden aria-label="Yardas desde el último golpe"><b id="liveN">–</b><small>yd</small></span>
    <span class="sync" id="sync">Guardado en este teléfono</span>
  </header>
  <main id="app"></main>
</div>

<script>
const DEFAULT_BAG=["Drive","Madera 3","Híbrido 4","Madera 5","Hierro 5","Hierro 6","Hierro 7","Hierro 8","Hierro 9","P","A","54","60"].map(name=>({name,dist:""}));
const PUTTER="Putter", OTRO="Otro", PENAL="Penal";
const LSBAG="golf.bag.v1";
let bag=(()=>{try{const b=JSON.parse(localStorage.getItem(LSBAG));if(Array.isArray(b)&&b.length===13&&b.every(x=>x&&x.name))return b}catch{}return DEFAULT_BAG.map(x=>({...x}))})();
function clubs(){return bag.map(b=>b.name)}
function shotName(c){return c===OTRO?"PENAL":c}
/* "Hierro 7" -> palabra chica + número grande */
function clubKind(c){return /^(Drive|Driver|Madera|H[ií]brido)/i.test(c)?"wood":/^Hierro/i.test(c)?"iron":/^(P|A|S|G|L|PW|AW|SW|GW|LW|Wedge.*|\d+)$/i.test(c)?"wedge":c===PUTTER?"":"other"}
function clubLabel(c){const m=/^(.*\D)\s(\d+)$/.exec(c);return `<span class="lb">${m?`<small>${esc(m[1])}</small><b>${m[2]}</b>`:`<b>${esc(c)}</b>`}</span>`}
const DEFAULT_COURSES=["Golfer's","Palermo","Pilara"];
const norm=s=>String(s||"").trim().toLowerCase();
function byNewest(){return Object.values(rounds).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function recentCourses(){
  const out=[];
  for(const r of byNewest()){const c=(r.course||"").trim();if(c&&!out.some(x=>norm(x)===norm(c)))out.push(c);if(out.length===3)break}
  for(const d of DEFAULT_COURSES){if(out.length===3)break;if(!out.some(x=>norm(x)===norm(d)))out.push(d)}
  return out;
}
/* par oficial de canchas conocidas, para la primera vez que se juegan */
const KNOWN_PARS=[
  [["golfers","golferscountryclub","golferscc"],[4,4,4,5,3,4,3,4,5,4,4,5,3,4,4,4,3,5]],
  [["palermo","lagosdepalermo","golfpalermo","golfdepalermo","campodegolfdepalermo","golfclublagosdepalermo"],[4,4,4,4,3,5,3,4,4,3,5,4,3,5,4,5,4,4]],
  [["pilara","pilaragolfclub","pilaragolf"],[5,3,4,4,4,4,5,3,4,4,3,4,3,5,4,4,4,5]],
  [["pilargolf","pilargolfclub","pilargolfazulblanca"],[4,5,4,4,4,3,5,3,4,5,3,4,5,4,4,4,3,4]],
];
const courseKey=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
function knownPars(course){const k=courseKey(course),e=KNOWN_PARS.find(([ks])=>ks.includes(k));return e?e[1]:null}
/* par de cada hoyo según la última ronda jugada en esa cancha; si nunca se jugó, el oficial */
function parsFor(course){
  const m={}, kp=knownPars(course);
  if(kp)kp.forEach((p,i)=>m[i+1]=p);
  for(const r of byNewest().reverse())if(norm(r.course)===norm(course))for(const h of r.holes)m[h.n]=h.par;
  return m;
}
const LS="golf.rounds.v1", LSDEL="golf.deleted.v1";
/* ---------- eclectic: mejor resultado de cada hoyo en el período ---------- */
const LSECL="golf.ecl.v1";
let ecl=(()=>{try{const e=JSON.parse(localStorage.getItem(LSECL));if(e&&Array.isArray(e.scores)&&e.scores.length===18)return e}catch{}return null})();
function saveEcl(){try{localStorage.setItem(LSECL,JSON.stringify(ecl))}catch{}}
function eclFor(r){return ecl&&ecl.course&&r&&norm(r.course)===norm(ecl.course)?ecl:null}
/* suma al eclectic las rondas terminadas (o de días anteriores) de esa cancha dentro del período; cada ronda una sola vez, así una corrección a mano no se pisa */
/* saca del eclectic lo que puso una ronda (si nadie lo cambió después), para volver a contarla con sus golpes nuevos */
function unapplyEcl(r){
  if(!ecl||!ecl.applied||!ecl.applied.includes(r.id))return;
  const u=ecl.undo&&ecl.undo[r.id];
  if(u)for(const k in u){const [prev,set]=u[k];if(ecl.scores[k]===set)ecl.scores[k]=prev}
  ecl.applied=ecl.applied.filter(x=>x!==r.id);
  if(ecl.imp)delete ecl.imp[r.id];if(ecl.undo)delete ecl.undo[r.id];
  saveEcl();
}
/* después de cambiar golpes de una ronda ya contada, la vuelve a contar */
function recountEcl(r){if(ecl&&ecl.applied&&ecl.applied.includes(r.id)){unapplyEcl(r);updateEcl()}}
function updateEcl(){
  if(!ecl||!ecl.course)return false;
  ecl.applied=ecl.applied||[];let ch=false;
  for(const r of Object.values(rounds)){
    if(ecl.applied.includes(r.id)||norm(r.course)!==norm(ecl.course))continue;
    if(!(r.done||(r.date&&r.date<today())))continue;
    if((ecl.from&&r.date<ecl.from)||(ecl.to&&r.date>ecl.to))continue;
    const imp=[],undo={};
    for(const h of r.holes){
      if(!h.shots.length)continue;
      if(h.shots.length===1&&h.par>=4)continue; /* un solo golpe en par 4 o 5: hoyo sin terminar, no cuenta */
      const k=h.n-1,v=h.shots.length;
      if(!ecl.scores[k]||v<ecl.scores[k]){if(ecl.scores[k])imp.push(h.n);undo[k]=[ecl.scores[k]||0,v];ecl.scores[k]=v;ecl.pars&&(ecl.pars[k]=h.par)}}
    ecl.applied.push(r.id);(ecl.imp=ecl.imp||{})[r.id]=imp;(ecl.undo=ecl.undo||{})[r.id]=undo;ch=true;
  }
  if(ch)saveEcl();return ch;
}

function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function fmtDate(s){if(!s)return"";const [y,m,d]=s.split("-");const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return `${+d} ${M[m-1]} ${y}`}

function totals(r,from=0,to=r.holes.length){
  let s=0,p=0,par=0,pl=0,parAll=0;
  for(const h of r.holes.slice(from,to)){parAll+=h.par;if(h.shots.length){s+=strokes(h);p+=putts(h);par+=h.par;pl++}}
  return {s,p,par,pl,parAll,diff:s-par};
}

async function flush(){
  if(!db||flushing)return; flushing=true;
  try{
    for(const id of [...deleted]){await col().doc(id).delete();deleted=deleted.filter(x=>x!==id);lsSet(LSDEL,deleted)}
    for(const id of [...dirty]){dirty.delete(id);const r=rounds[id];if(r)await col().doc(id).set(JSON.parse(JSON.stringify(r)))}
    setSync("Guardado en tu cuenta");
  }catch(e){setSync("Guardado en este teléfono");}
  flushing=false; if(dirty.size)setTimeout(flush,3000);
}

async function initCloud(){
  for(let i=0;i<30&&!window.claude?.use;i++)await new Promise(r=>setTimeout(r,100));
  if(!window.claude?.use)return;
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id(); if(!id)return;
    db=d; uid=id;

    for(const doc of snap.docs){
      const r=doc.data(); if(!r||deleted.includes(doc.id))continue;
      const loc=rounds[doc.id];
      if(!loc||(r.updatedAt||0)>(loc.updatedAt||0)){rounds[doc.id]=JSON.parse(JSON.stringify(r));changed=true}
    }

    for(const id in rounds){const rr=snap.docs.find(d=>d.id===id)?.data();if(!remote.has(id)||(rounds[id].updatedAt||0)>(rr?.updatedAt||0))dirty.add(id)}
    if(changed){lsSet(LS,rounds);render()}
    setSync("Guardado en tu cuenta");

  }catch(e){setSync("Guardado en este teléfono")}
}

function fireworks(bursts){
  const old=document.getElementById("fw");if(old)old.remove();
  const c=document.createElement("canvas");c.id="fw";
  c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  const cols=["#ffd34d","#ff6b6b","#5ad38a","#6fc3ff","#ff9ff3","#ffffff"],ps=[];
  const boom=(x,y)=>{const col=cols[Math.random()*cols.length|0];for(let k=0;k<60;k++){const a=Math.random()*6.283,v=1.5+Math.random()*4.5;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col})}};
  for(let b=0;b<bursts;b++)setTimeout(()=>boom(W*(.2+Math.random()*.6),H*(.15+Math.random()*.35)),b*300);
  const end=performance.now()+bursts*300+1600;
  (function step(t){
    g.clearRect(0,0,W,H);
    for(const p of ps){if(p.life<=0)continue;p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.98;p.vy*=.98;p.life-=.012;
      g.globalAlpha=Math.max(p.life,0);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,2.4,0,6.283);g.fill()}
    if(t<end)requestAnimationFrame(step);else c.remove();
  })(performance.now());
}

/* ---------- GPS: al tocar un palo se guarda dónde estás; el golpe mide hasta el toque siguiente ---------- */
const LSGPS="golf.gps.v1";
let gpsOn=lsGet(LSGPS,true), gpsMsg="";
function metersBetween(a,b){const R=6371000,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t,x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
/* distancia del golpe k del hoyo (hasta donde se tocó el golpe siguiente); low = GPS poco preciso */
function shotDist(h,k){const a=h.pos&&h.pos[k],b=h.pos&&h.pos[k+1];if(!a||!b)return null;const m=Math.round(metersBetween(a,b)*1.09361);return {m,low:Math.max(a[2],b[2])>15,acc:Math.max(a[2],b[2])}}
/* El primer dato del GPS después de estar apagado suele venir de antenas o wifi (errores de 30 a 100 m o más).
   Por eso escucha hasta 12 segundos y se queda con el dato más preciso; corta antes si baja de 6 m. */
function markPos(r,h,k,club){
  if(!gpsOn||!navigator.geolocation)return;
  let best=null,id=null,t0=Date.now();
  const store=()=>{
    if(id!==null)navigator.geolocation.clearWatch(id);id=null;
    if(!best||h.shots[k]!==club)return;
    const c=best.coords;
    gpsMsg=c.accuracy>500?"El iPhone está dando la ubicación aproximada: activá «Ubicación exacta» en Configuración › Privacidad › Localización › Sitios web de Safari.":"";
    h.pos=h.pos||[];while(h.pos.length<h.shots.length)h.pos.push(null);
    h.pos[k]=[+c.latitude.toFixed(6),+c.longitude.toFixed(6),Math.round(c.accuracy)];
    save(r);if(view.name==="play"&&rounds[view.id]===r)render();
  };
  const timer=setTimeout(store,12000);
  id=navigator.geolocation.watchPosition(p=>{
    if(p.timestamp&&p.timestamp<t0-1000)return;
    if(!best||p.coords.accuracy<best.coords.accuracy)best=p;
    if(best.coords.accuracy<=6){clearTimeout(timer);store()}
  },e=>{clearTimeout(timer);if(id!==null)navigator.geolocation.clearWatch(id);id=null;
    gpsMsg=e.code===1?"El GPS no tiene permiso: activalo en Configuración › Privacidad › Localización para medir los golpes.":"";if(gpsMsg&&view.name==="play")render()},
  {enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
/* contador en vivo: yardas desde donde se tocó el último palo hasta donde estás ahora (como el reloj Garmin) */
let liveId=null, liveFix=null;
function liveRef(){
  if(view.name!=="play")return null;const r=rounds[view.id];if(!r)return null;
  const h=r.holes[Math.min(view.hole||0,r.holes.length-1)];if(!h||!h.shots.length)return null;
  const k=h.shots.length-1;return (h.pos&&h.pos[k])||(h.tapFix&&h.tapFix.k===k&&h.tapFix.p)||null;
}
function livePaint(){
  const el=$("#live");if(!el)return;el.hidden=!(view.name==="play"&&gpsOn);if(el.hidden)return;

/* ---------- lectura de la captura del eclectic del club ---------- */
/* La captura de golferscc.com tiene siempre el mismo diseño: busca los 18 casilleros por color
   y compara cada número con moldes de la fuente del club (no es OCR general). */
const OCR_GW=10, OCR_GH=14;
function ocrGlyphs(img,x0,y0,x1,y1,isInk,gap){
  const W=img.width, d=img.data, cols=[];
  for(let x=x0;x<x1;x++){let n=0;for(let y=y0;y<y1;y++){const i=(y*W+x)*4;if(isInk(d[i],d[i+1],d[i+2]))n++}cols.push(n)}
  const gl=[];let s=-1,empty=0;
  for(let k=0;k<=cols.length;k++){const on=k<cols.length&&cols[k]>0;
    if(on){if(s<0)s=k;empty=0}else if(s>=0){empty++;if(empty>=gap||k===cols.length){gl.push([x0+s,x0+k-empty+1]);s=-1;empty=0}}}
  return gl.map(([a,b])=>{
    let t=y1,bt=y0,n=0;
    for(let y=y0;y<y1;y++)for(let x=a;x<b;x++){const i=(y*W+x)*4;if(isInk(d[i],d[i+1],d[i+2])){if(y<t)t=y;if(y>bt)bt=y;n++}}
    if(!n)return null;
    const w=b-a,h=bt-t+1,v=new Array(OCR_GW*OCR_GH).fill(0);
    for(let y=t;y<=bt;y++)for(let x=a;x<b;x++){const i=(y*W+x)*4;if(isInk(d[i],d[i+1],d[i+2]))v[Math.min(OCR_GH-1,((y-t)*OCR_GH/h)|0)*OCR_GW+Math.min(OCR_GW-1,((x-a)*OCR_GW/w)|0)]++}
    const cell=(w*h)/(OCR_GW*OCR_GH);
    return {x:a,w,h,ar:w/h,v:v.map(c=>c/cell),n};
  }).filter(Boolean);
}
function ocrMatch(g,T){
  let best=null,bd=1e9,second=1e9;
  for(const ch in T)for(const t of T[ch]){let dd=Math.abs(g.ar-t.ar)*6;for(let k=0;k<g.v.length;k++)dd+=Math.abs(g.v[k]-t.v[k]);dd/=g.v.length;
    if(dd<bd){if(best!==ch)second=bd;bd=dd;best=ch}else if(dd<second&&ch!==best)second=dd}
  return {ch:best,d:bd,margin:second-bd};
}
const near=(a,b,t)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2])<t;
function px(img,x,y){const i=(y*img.width+x)*4;return [img.data[i],img.data[i+1],img.data[i+2]]}
/* devuelve los glifos crudos de la captura; ocrRead les pone números con los moldes */
function ocrScan(img){
  const W=img.width,H=img.height,k=W/1179,R=v=>Math.round(v*k);
  const white=[255,255,255];
  /* el recuadro azul oscuro (nombre, gross, hcp) termina justo arriba de la tabla */
  let nav=-1;for(let y=Math.round(H*.2);y<Math.round(H*.7);y++){const p=px(img,R(60),y);if(p[0]+p[1]+p[2]<220)nav=y}
  if(nav<0)return null;
  const boxes=xc=>{const out=[];let s=-1;
    for(let y=nav+R(20);y<H-R(250);y++){const on=!near(px(img,xc,y),white,30);
      if(on&&s<0)s=y; if(!on&&s>=0){const h=y-s;if(h>R(80)&&h<R(135))out.push([s,y]);s=-1}}
    return out.slice(0,9)};
  const cols=[[R(405),R(392),R(515)],[R(981),R(968),R(1090)]].map(([xc,xa,xb])=>({xc,xa,xb,bx:boxes(xc)}));
  if(cols.some(c=>c.bx.length!==9))return null;
  const cells=[], totals=[];

function renderEcl(){

  updateEcl();

  const pars=e.pars&&e.pars.length===18?e.pars:(knownPars(e.course)||[]);
  const col=a=>`<div class="eclcol"><div class="eclhead"><span>H</span><span>P</span><span>SCORE</span></div>${a.map(k=>`<label class="eclh"><span class="n">${k+1}</span><span class="p">${pars[k]||""}</span><input id="es${k}" value="${e.scores[k]||""}" inputmode="numeric" maxlength="2" aria-label="Hoyo ${k+1}"></label>`).join("")}<div class="ecltot"><span>Total</span><span id="et${a[0]}"></span></div></div>`;
  app.innerHTML=`<section><form id="eclF" class="admin">
    <div class="eclsum"><div><span class="label">Gross</span><b id="eG">–</b></div><div><span class="label">Hcp</span><b><input id="eH" value="${esc(e.hcp||"")}" inputmode="decimal" maxlength="5" style="width:70px;text-align:center;font-weight:700;font-size:20px;min-height:36px"></b></div><div><span class="label">Neto</span><b id="eN">–</b></div></div>
    <label class="field"><span class="label">Cancha</span><input id="eC" value="${esc(e.course||"")}"></label>
    <div class="ecldates"><label class="field"><span class="label">Desde</span><input type="date" id="eF" value="${esc(e.from||"")}"></label><label class="field"><span class="label">Hasta</span><input type="date" id="eT" value="${esc(e.to||"")}"></label></div>
    <div class="eclrow">${col([0,1,2,3,4,5,6,7,8])}${col([9,10,11,12,13,14,15,16,17])}</div>
    <button class="btn ghost wide" type="button" id="ocrBtn">Comparar con la captura del club</button>
    <input type="file" id="ocrFile" accept="image/*" hidden>
    <div id="ocrOut" class="ocrout" hidden></div>
    <div class="eclkey"><span><i class="bir"></i>Birdie</span><span><i></i>Par</span><span><i class="bog"></i>Bogey</span><span><i class="dbl"></i>Doble o más</span></div>
    <p class="hint">Cada ronda terminada en esta cancha dentro del período baja automáticamente los hoyos donde mejoraste. Si algo no coincide con el club, corregilo acá.</p>
    <button class="btn" type="submit">Guardar eclectic</button>
  </form></section>`;
  const vals=()=>Array.from({length:18},(_,k)=>+($("#es"+k).value.replace(/\D/g,""))||0);
  const sums=()=>{const v=vals(),a=v.slice(0,9).reduce((x,y)=>x+y,0),b=v.slice(9).reduce((x,y)=>x+y,0),g=a+b,h=parseFloat(($("#eH").value||"").replace(",","."));
    v.forEach((x,k)=>{const d=x&&pars[k]?x-pars[k]:null;$("#es"+k).className=d===null||d===0?"":d<0?"bir":d===1?"bog":"dbl"});
    $("#et0").textContent=a||"–";$("#et9").textContent=b||"–";$("#eG").textContent=g||"–";$("#eN").textContent=g&&!isNaN(h)?String(Math.round((g-h)*10)/10).replace(".",","):"–"};
  app.querySelectorAll("#eclF input").forEach(x=>x.oninput=sums);sums();
  $("#ocrBtn").onclick=()=>$("#ocrFile").click();
  $("#ocrFile").onchange=async ev=>{
    const f=ev.target.files[0];ev.target.value="";if(!f)return;
    const out=$("#ocrOut");out.hidden=false;out.innerHTML=`<p class="hint">Leyendo la captura…</p>`;
    let res=null;
    try{const bm=await createImageBitmap(f),c=document.createElement("canvas");c.width=bm.width;c.height=bm.height;const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(bm,0,0);
      res=ocrRead(g.getImageData(0,0,c.width,c.height),OCR_T,pars)}catch{}
    if(!res){out.innerHTML=`<p><b>No pude leer esa captura.</b> Tiene que ser la pantalla del eclectic de golferscc.com, entera, como la sacás con el teléfono.</p>`;return}
    app.querySelectorAll(".eclh input").forEach(x=>x.classList.remove("diff","unsure"));
    const cur=vals(), diffs=[], unsure=[];
    res.scores.forEach((v,k)=>{if(!res.sure[k]){unsure.push(k+1);$("#es"+k).classList.add("unsure")}else if(v!==cur[k]){diffs.push(k);$("#es"+k).classList.add("diff")}});
    const hcpNow=$("#eH").value.trim().replace(",","."), hcpDiff=res.hcp&&res.hcp!==hcpNow;
    let h="";
    if(!diffs.length&&!hcpDiff)h=`<p><b>✓ Coincide con el club</b>: ${res.scores.reduce((a,b)=>a+b,0)} golpes${res.hcp?`, hcp ${res.hcp}`:""}.</p>`;
    else{h=`<p><b>Hay diferencias con el club:</b></p><ul>${diffs.map(k=>`<li>Hoyo ${k+1}: club <b>${res.scores[k]}</b> · app ${cur[k]||"–"}</li>`).join("")}${hcpDiff?`<li>Hcp: club <b>${res.hcp}</b> · app ${esc(hcpNow)||"–"}</li>`:""}</ul>
      <button class="btn wide" type="button" id="ocrUse">Usar los valores del club</button>`}
    if(unsure.length)h+=`<p class="hint">No estoy seguro de ${unsure.length===1?"el hoyo":"los hoyos"} ${unsure.join(", ")}: miralos vos.</p>`;
    out.innerHTML=h;
    const u=$("#ocrUse");if(u)u.onclick=()=>{diffs.forEach(k=>{$("#es"+k).value=res.scores[k];$("#es"+k).classList.remove("diff")});if(hcpDiff)$("#eH").value=res.hcp;sums();
      out.innerHTML=`<p><b>Listo, cargué los valores del club.</b> Tocá "Guardar eclectic" para que queden.</p>`};
  };
  $("#eclF").onsubmit=ev=>{
    ev.preventDefault();
    const course=$("#eC").value.trim(),changed=!ecl||norm(course)!==norm(ecl.course)||$("#eF").value!==ecl.from||$("#eT").value!==ecl.to;
    ecl={course,from:$("#eF").value,to:$("#eT").value,hcp:$("#eH").value.trim(),scores:vals(),pars:pars.slice(),applied:changed?[]:(ecl.applied||[])};
    if(changed){/* rondas ya jugadas antes de cargarlo se suponen incluidas en lo que escribiste */
      for(const r of Object.values(rounds))if(norm(r.course)===norm(course)&&(r.done||r.date<today()))ecl.applied.push(r.id)}
    saveEcl();go({name:"admin"});
  };
}

function roundText(r){
  const t=totals(r), L=[`⛳ ${r.course||"Ronda"} · ${fmtDate(r.date)}${r.time?" · "+r.time:""}`];
  if(r.partners?.length)L.push("Con "+r.partners.join(", "));
  L.push(`Total ${t.pl?t.s:"–"} (${diffTxt(t.diff,t.pl)}) · ${t.p} putts · ${t.pl}/${r.holes.length} hoyos`);
  for(const front of [true,false]){
    const hs=r.holes.filter(x=>(x.n<=9)===front); if(!hs.length)continue;
    const x=totals({holes:hs});
    L.push(`Hoyos ${hs[0].n}-${hs[hs.length-1].n}: ${hs.map(h=>h.shots.length||"-").join(" ")} = ${x.pl?x.s:"–"} (par ${x.parAll})`);
  }
  return L.join("\n");
}

  const k=[];const code=c=>{let i=k.indexOf(c);if(i<0){k.push(c);i=k.length-1}return String.fromCharCode(97+i)};
  const o={v:1,c:r.course||"",d:r.date||"",t:r.time||"",p:r.partners||[],h:r.holes.map(h=>[h.n,h.par,h.shots.map(code).join("")]),k,e:eclBetter(r)};
  return APP_URL+"#r="+b64u(JSON.stringify(o));
}
function decodeRound(t){
  try{const o=JSON.parse(unb64u(t));if(!o||!Array.isArray(o.h)||!Array.isArray(o.k))return null;
    return {id:"shared",course:String(o.c||""),date:String(o.d||""),time:String(o.t||""),partners:(o.p||[]).map(String),done:true,eImp:(o.e||[]).map(Number),
      holes:o.h.map(([n,par,sh])=>({n:+n,par:+par,shots:[...String(sh||"")].map(ch=>String(o.k[ch.charCodeAt(0)-97]||OTRO))}))}}catch{return null}
}
/* ---------- imágenes de la ronda (tarjeta + estadísticas) ---------- */
const IMG={bg:"#ffffff",ink:"#1d2433",muted:"#5b6475",line:"#d5dae2",green:"#1f5e3b",par:"#1f8f55",bir:"#bfe7ff",birB:"#7cc4ee",bog:"#f4ee4e",bogB:"#e2da2a",dbl:"#ef4a6a",dblB:"#e0345a",ecl:"#7b5cd6"};
function cardCanvas(W,H){const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.fillStyle=IMG.bg;g.fillRect(0,0,W,H);g.textBaseline="middle";return [c,g]}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(g,s,x,y,font,col,al="center"){g.font=font;g.fillStyle=col;g.textAlign=al;g.fillText(s,x,y)}
const FD='"Barlow Condensed","Arial Narrow",sans-serif', FB='"Source Sans 3",-apple-system,sans-serif';
function imgHeader(g,r,W,sub){
  g.fillStyle=IMG.green;g.fillRect(0,0,W,190);
  txt(g,(r.course||"Ronda").toUpperCase(),50,70,`700 72px ${FD}`,"#fff","left");
  txt(g,[fmtDate(r.date)+(r.time?" · "+r.time+" h":""),r.partners?.length?"Con "+r.partners.join(", "):""].filter(Boolean).join("   ·   "),50,138,`600 34px ${FB}`,"#d6eadc","left");
  txt(g,sub,W-50,70,`700 40px ${FD}`,"#f4d35e","right");
}
function imgCard(r){
  const W=1080, groups=[r.holes.filter(h=>h.n<=9),r.holes.filter(h=>h.n>=10)].filter(x=>x.length), rows=Math.max(...groups.map(x=>x.length));
  const top=190, tiles=170, head=60, rowH=88, H=top+tiles+head+rows*rowH+100+90;
  const [c,g]=cardCanvas(W,H), t=totals(r), better=new Set(eclBetter(r));
  imgHeader(g,r,W,"TARJETA");
  [[t.pl?t.s:"–","GOLPES"],[t.p,"PUTTS"],[diffTxt(t.diff,t.pl),`${t.pl}/${r.holes.length} HOYOS`]].forEach(([v,l],k)=>{const x=40+k*340;rr(g,x,top+25,320,125,18);g.fillStyle="#f2f4f7";g.fill();txt(g,String(v),x+160,top+75,`700 64px ${FD}`,IMG.ink);txt(g,l,x+160,top+125,`700 24px ${FB}`,IMG.muted)});
  const colW=(W-80-(groups.length-1)*30)/groups.length;
  groups.forEach((hs,gi)=>{
    const x0=40+gi*(colW+30), cols=[.16,.2,.36,.28].map(f=>f*colW); let y=top+tiles+head/2+10;
    const cx=k=>x0+cols.slice(0,k).reduce((a,b)=>a+b,0)+cols[k]/2;
    ["H","PAR","GOLPES","PUTTS"].forEach((l,k)=>txt(g,l,cx(k),y,`700 26px ${FB}`,IMG.muted));
    y+=head/2+10;
    hs.forEach(h=>{
      const yc=y+rowH/2; g.strokeStyle=IMG.line;g.lineWidth=2;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+colW,y);g.stroke();
      txt(g,String(h.n),cx(0),yc,`700 38px ${FD}`,IMG.ink);
      txt(g,String(h.par),cx(1),yc,`700 46px ${FD}`,IMG.par);
      const s=h.shots.length, d=s-h.par, bw=cols[2]*.72, bx=cx(2)-bw/2;
      if(s){const [f,b,ti]=d<0?[IMG.bir,IMG.birB,IMG.ink]:d===0?["#fff","#c3c9d3",IMG.ink]:d===1?[IMG.bog,IMG.bogB,IMG.ink]:[IMG.dbl,IMG.dblB,"#fff"];
        rr(g,bx,y+10,bw,rowH-20,12);g.fillStyle=f;g.fill();g.lineWidth=better.has(h.n)?7:3;g.strokeStyle=better.has(h.n)?IMG.ecl:b;g.stroke();
        txt(g,String(s),cx(2),yc+2,`700 50px ${FD}`,ti)}
      else txt(g,"·",cx(2),yc,`700 40px ${FD}`,IMG.muted);
      txt(g,s?String(putts(h)):"·",cx(3),yc,`700 40px ${FD}`,IMG.ink);
      y+=rowH;
    });
    const x=totals({holes:hs}); g.fillStyle="#eef4f0";g.fillRect(x0,y,colW,80);
    txt(g,hs[0].n<=9?"IDA":"VUELTA",cx(0)+10,y+40,`700 30px ${FD}`,IMG.green);
    txt(g,String(x.parAll),cx(1),y+40,`700 40px ${FD}`,IMG.par);
    txt(g,x.pl?String(x.s):"–",cx(2),y+40,`700 48px ${FD}`,IMG.ink);
    txt(g,x.pl?String(x.p):"–",cx(3),y+40,`700 40px ${FD}`,IMG.ink);
  });
  let ly=top+tiles+head+rows*rowH+100+50, lx=40;
  [[IMG.bir,IMG.birB,"Birdie o mejor"],["#fff","#c3c9d3","Par"],[IMG.bog,IMG.bogB,"Bogey"],[IMG.dbl,IMG.dblB,"Doble o más"]].concat(better.size?[["#fff",IMG.ecl,"Mejora el eclectic"]]:[]).forEach(([f,b,l])=>{
    rr(g,lx,ly-16,32,32,7);g.fillStyle=f;g.fill();g.lineWidth=b===IMG.ecl?6:3;g.strokeStyle=b;g.stroke();
    g.font=`600 26px ${FB}`;txt(g,l,lx+44,ly,`600 26px ${FB}`,IMG.muted,"left");lx+=44+g.measureText(l).width+30});
  return c;
}
function imgStats(r){
  const use={};for(const h of r.holes)for(const c of h.shots)use[c]=(use[c]||0)+1;
  const known=[...clubs(),PUTTER,OTRO,PENAL], order=[...known.filter(c=>use[c]),...Object.keys(use).filter(c=>!known.includes(c))], max=Math.max(1,...Object.values(use));
  const pl=r.holes.filter(h=>h.shots.length), t=totals(r), better=eclBetter(r);
  const cnt=[["Águila o mejor",d=>d<=-2],["Birdie",d=>d===-1],["Par",d=>d===0],["Bogey",d=>d===1],["Doble",d=>d===2],["Triple o más",d=>d>=3]].map(([l,f])=>[l,pl.filter(h=>f(h.shots.length-h.par)).length]).filter(([l,n])=>n||["Birdie","Par","Bogey","Doble"].includes(l));
  const W=1080, H=190+60+ Math.ceil(cnt.length/3)*150 + 60+170 + 70+order.length*64 + (better.length?150:0) + 60;
  const [c,g]=cardCanvas(W,H); imgHeader(g,r,W,"ESTADÍSTICAS");
  let y=250;
  txt(g,"RESULTADOS",40,y,`700 30px ${FB}`,IMG.muted,"left");y+=30;
  cnt.forEach(([l,n],k)=>{const x=40+(k%3)*340,yy=y+Math.floor(k/3)*150;rr(g,x,yy,320,130,18);g.fillStyle="#f2f4f7";g.fill();txt(g,String(n),x+160,yy+55,`700 64px ${FD}`,IMG.ink);txt(g,l.toUpperCase(),x+160,yy+105,`700 24px ${FB}`,IMG.muted)});
  y+=Math.ceil(cnt.length/3)*150+40;
  txt(g,"PUTTS",40,y,`700 30px ${FB}`,IMG.muted,"left");y+=30;
  const p1=pl.filter(h=>putts(h)===1).length,p3=pl.filter(h=>putts(h)>=3).length;
  [[t.p,"TOTAL"],[pl.length?(t.p/pl.length).toFixed(1).replace(".",","):"–","POR HOYO"],[`${p1} / ${p3}`,"1 PUTT / 3 O MÁS"]].forEach(([v,l],k)=>{const x=40+k*340;rr(g,x,y,320,130,18);g.fillStyle="#f2f4f7";g.fill();txt(g,String(v),x+160,y+55,`700 64px ${FD}`,IMG.ink);txt(g,l,x+160,y+105,`700 24px ${FB}`,IMG.muted)});
  y+=170;
  txt(g,"PALOS USADOS",40,y,`700 30px ${FB}`,IMG.muted,"left");y+=50;
  order.forEach(cl=>{txt(g,shotName(cl),40,y,`700 36px ${FD}`,IMG.ink,"left");const bw=(W-40-260-90)*use[cl]/max;rr(g,260,y-14,Math.max(bw,28),28,14);g.fillStyle=clubKind(cl)==="wood"?"#a9825a":clubKind(cl)==="iron"?"#5fa9cf":clubKind(cl)==="wedge"?"#4f7fd9":cl===PUTTER?IMG.par:"#9aa3ad";g.fill();txt(g,String(use[cl]),W-40,y,`700 36px ${FD}`,IMG.ink,"right");y+=64});
  if(better.length){y+=30;rr(g,40,y,W-80,100,18);g.fillStyle="#efeafc";g.fill();g.lineWidth=4;g.strokeStyle=IMG.ecl;g.stroke();txt(g,`Mejoró el eclectic en ${better.length===1?"el hoyo":"los hoyos"} ${better.join(", ")}`,W/2,y+50,`700 38px ${FD}`,"#4b3596")}
  return c;
}
const toFile=(c,name)=>new Promise(res=>c.toBlob(b=>res(new File([b],name,{type:"image/png"})),"image/png"));
async function sendRound(r){
  const txt=roundText(r);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const base="ronda-"+(r.date||today()), files=[await toFile(imgCard(r),base+"-tarjeta.png"),await toFile(imgStats(r),base+"-estadisticas.png")];
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});sendExtra(txt);return}
    const o=$("#shareOut");if(o&&!navigator.share){o.innerHTML="";for(const f of files){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.textContent="Descargar "+f.name;a.className="btn ghost wide";o.appendChild(a)}}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);bkMsg("Copié la ronda. Pegala en WhatsApp o en un mail.");return}catch{}
  const o=$("#shareOut")||$("#bkMsg")?.parentNode; if(o){const ta=document.createElement("textarea");ta.className="sharebox";ta.readOnly=true;ta.value=txt;o.appendChild(ta);ta.select()}
  bkMsg("Copiá este texto y pegalo donde quieras.");
}
/* el texto va aparte (si va con las fotos, WhatsApp lo pega como epígrafe de la primera); el iPhone pide un toque para cada envío */
function sendExtra(txt){
  const o=$("#shareOut");if(!o)return;
  o.innerHTML=`<button class="btn wide" id="sendLink">Ahora mandá el resumen en texto</button>`;
  $("#sendLink").onclick=async()=>{try{await navigator.share({text:txt});o.innerHTML=""}catch{}};
}
